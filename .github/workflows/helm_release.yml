on:
  workflow_run:
    workflows: ["Docker"]
    types:
      - completed

name: Helm Chart Release PR

jobs:
  create-pr:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check Out Repo
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a semver tag, skipping"
            exit 1
          fi

          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Update Chart versions
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.version }}/" helm/junosexporter/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: ${{ steps.version.outputs.version }}/" helm/junosexporter/Chart.yaml

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(helm): release chart ${{ steps.version.outputs.version }}"
          branch: helm-release/${{ steps.version.outputs.version }}
          title: "chore(helm): release chart ${{ steps.version.outputs.version }}"
          body: |
            Automated chart version bump following app release `${{ github.event.workflow_run.head_branch }}`.

            Changes:
            - `version`: bumped to `${{ steps.version.outputs.version }}`
            - `appVersion`: bumped to `${{ steps.version.outputs.version }}`

            Merging this PR will trigger the Helm Chart Publish workflow, which packages and pushes
            the chart to `oci://ghcr.io/${{ github.repository_owner }}/charts`.
          labels: helm
